
<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tanuljunk órát!</title>
<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 20px;
  min-height: 100vh;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #e8f3ff, #f5edff);
  color: #25334a;
  display: flex;
  justify-content: center;
  align-items: center;
}

.app {
  width: 100%;
  max-width: 850px;
  background: white;
  border-radius: 24px;
  padding: 28px;
  box-shadow: 0 12px 40px rgba(35,55,90,.13);
}

h1 {
  text-align: center;
  margin: 0 0 24px;
  color: #253e68;
}

h2 { color: #304d78; margin-top: 0; }

.screen { display: none; }
.screen.active { display: block; }

.setup-group { margin: 20px 0; }

.group-label {
  display: block;
  font-weight: bold;
  margin-bottom: 9px;
}

select, input {
  padding: 12px;
  border: 2px solid #d7e1ef;
  border-radius: 10px;
  font-size: 16px;
  background: white;
  color: #25334a;
}

.setup-group > select,
.setup-group > input {
  width: 100%;
}

.radio-list {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
}

.radio-option {
  flex: 1 1 180px;
  padding: 13px;
  border: 2px solid #d7e1ef;
  border-radius: 12px;
  cursor: pointer;
  display: flex;
  gap: 8px;
  align-items: center;
}

.radio-option:has(input:checked) {
  border-color: #477bd1;
  background: #edf4ff;
}

button {
  border: 0;
  border-radius: 12px;
  padding: 13px 22px;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
  background: #477bd1;
  color: white;
  transition: background .15s, transform .15s;
}

button:hover {
  background: #3264b6;
  transform: translateY(-1px);
}

button:disabled {
  opacity: .5;
  cursor: not-allowed;
  transform: none;
}

.primary-button {
  width: 100%;
  margin-top: 18px;
  font-size: 18px;
  padding: 16px;
}

.progress-area { margin-bottom: 22px; }

.progress-text {
  display: flex;
  justify-content: space-between;
  font-weight: bold;
  color: #65758c;
  margin-bottom: 8px;
}

.progress-track {
  height: 10px;
  border-radius: 10px;
  background: #e8edf5;
  overflow: hidden;
}

.progress-fill {
  height: 100%;
  width: 0;
  background: #5c91df;
  transition: width .3s;
}

.task-text {
  text-align: center;
  font-size: 24px;
  font-weight: bold;
  margin: 20px 0;
  color: #304d78;
}

.clock-layout {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 35px;
  margin: 25px auto;
  flex-wrap: wrap;
}

.clock {
  position: relative;
  width: min( min(70vw, 390px), 390px);
  height: min( min(70vw, 390px), 390px);
  outline: 2px solid #34445e;
  border-radius: 50%;
  background: radial-gradient(circle, #fff 0%, #f9fbff 75%, #e9eff8 100%);
  box-shadow:
    0 8px 20px rgba(30,50,80,.52);
  flex-shrink: 0;
  touch-action: none;
  user-select: none;
}

.clock-number {
  position: absolute;
  width: 36px;
  height: 36px;
  margin-left: -18px;
  margin-top: -18px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: clamp(16px, 3vw, 23px);
  font-weight: bold;
  color: #263c5b;
  pointer-events: none;
  z-index: 1;
}

.hand {
  position: absolute;
  left: 50%;
  top: 50%;
  bottom: auto;
  transform-origin: 50% 100%;
  border-radius: 10px;
  cursor: grab;
  touch-action: none;
  user-select: none;
}

.hour-hand {
  width: 10px;
  height: 25%;
  margin-left: -5px;
  margin-top: -25%;
  background: #2674c9;
  z-index: 5;
}

.minute-hand {
  width: 6px;
  height: 37%;
  margin-left: -3px;
  margin-top: -37%;
  background: #e34b4b;
  z-index: 6;
}

.clock-center {
  position: absolute;
  left: 50%;
  top: 50%;
  width: 23px;
  height: 23px;
  transform: translate(-50%, -50%);
  margin: 0;
  border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, #647995, #263c5b 70%);
  border: 4px solid white;
  box-shadow: 0 1px 4px rgba(0,0,0,.35);
  z-index: 20;
  pointer-events: none;
}

/* Kompakt, bordázott óraállító korona */
.knob-area {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
}

.knob-label {
  font-size: 14px;
  font-weight: bold;
  color: #64748b;
}

.knob {
  position: relative;
  width: 58px;
  height: 58px;
  border-radius: 50%;
  border: 3px solid #8995a2;
  background:
    repeating-conic-gradient(
      from 0deg,
      #687583 0deg 4deg,
      #dce2e8 5deg 8deg,
      #8995a2 9deg 12deg
    );
  box-shadow:
    inset 0 2px 5px rgba(255,255,255,.8),
    inset 0 -3px 6px rgba(0,0,0,.3),
    0 4px 9px rgba(0,0,0,.2);
  cursor: grab;
  touch-action: none;
  user-select: none;
}

.knob::before {
  content: "";
  position: absolute;
  inset: 10px;
  border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, #f4f6f8, #aeb8c2 55%, #778493);
  border: 1px solid #788594;
  box-shadow: inset 0 1px 3px rgba(255,255,255,.8);
}

.knob:active { cursor: grabbing; }

.period-controls {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 12px;
  margin: 10px 0 20px;
  flex-wrap: wrap;
}

.period-controls label { font-weight: bold; }

.period-controls select {
  width: auto;
  min-width: 180px;
  font-weight: bold;
}

.period-indicator {
  text-align: center;
  font-size: 18px;
  font-weight: bold;
  margin: 10px 0 20px;
  color: #536b8e;
}

.answer-area {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 12px;
  margin: 25px auto;
}

.answer-area input {
  width: 125px;
  min-width: 0;
  text-align: center;
  font-size: 30px;
  font-weight: bold;
  padding: 14px 8px;
}

.answer-area span {
  font-size: 30px;
  font-weight: bold;
}

.feedback {
  text-align: center;
  margin: 20px 0 10px;
  font-size: 18px;
  font-weight: bold;
  line-height: 1.5;
  min-height: 28px;
}

.feedback.correct { color: #218653; }
.feedback.incorrect { color: #c34b4b; }

.next-task-area {
  display: none;
  text-align: center;
  margin: 15px 0;
}

.next-task-area.visible { display: block; }

.controls {
  display: flex;
  justify-content: center;
  gap: 12px;
  margin-top: 20px;
  flex-wrap: wrap;
}

.controls button { min-width: 150px; }

.result-score {
  text-align: center;
  font-size: 56px;
  font-weight: bold;
  color: #477bd1;
  margin: 20px 0 8px;
}

.result-subtitle {
  text-align: center;
  font-size: 20px;
  color: #536b8e;
}

.stars {
  text-align: center;
  font-size: 42px;
  margin: 18px 0;
}

.result-details {
  text-align: center;
  font-size: 18px;
  line-height: 1.7;
  color: #536b8e;
}

@media (max-width: 600px) {
  body { padding: 10px; }
  .app { padding: 18px; }
  .clock-layout { gap: 22px; }
  .clock { width: min(76vw, 330px); height: min(76vw, 330px); }
  .task-text { font-size: 21px; }
  .answer-area input { width: 115px; }
}
</style>
</head>
<body>
<div class="app">

<h1>🕒 Tanuljunk órát!</h1>

<section id="setupScreen" class="screen active">
  <h2>Óra beállítása</h2>

  <div class="setup-group">
    <label class="group-label" for="difficulty">Nehézségi szint</label>
    <select id="difficulty">
      <option value="0">1. Egész órák</option>
      <option value="1">2. Félórák</option>
      <option value="2">3. Negyedórák</option>
      <option value="3">4. Ötperces pontosság</option>
      <option value="4">5. Egyperces pontosság</option>
    </select>
  </div>

  <div class="setup-group">
    <label class="group-label" for="taskCount">Feladatok száma</label>
    <input id="taskCount" type="number" min="1" max="100" value="10">
  </div>

  <div class="setup-group">
    <span class="group-label">Gyakorlás módja</span>
    <div class="radio-list">
      <label class="radio-option">
        <input type="radio" name="mode" value="set" checked>
        Állítsd be az órát!
      </label>
      <label class="radio-option">
        <input type="radio" name="mode" value="read">
        Mennyi az idő?
      </label>
    </div>
  </div>

  <div class="setup-group">
    <label class="group-label" for="startNumbers">Számlap számai</label>
    <select id="startNumbers">
      <option value="arabic">Arab számok (1, 2, 3...)</option>
      <option value="roman">Római számok (I, II, III...)</option>
    </select>
  </div>

  <button class="primary-button" id="startButton">Kezdés!</button>
</section>

<section id="gameScreen" class="screen">
  <div class="progress-area">
    <div class="progress-text">
      <span id="progressLabel">1. feladat</span>
      <span id="scoreLabel">Helyes válaszok: 0</span>
    </div>
    <div class="progress-track">
      <div class="progress-fill" id="progressFill"></div>
    </div>
  </div>

  <div class="task-text" id="taskText"></div>

  <div id="setPeriodControls" class="period-controls">
    <label for="periodSelect">Napszak:</label>
    <select id="periodSelect">
      <option value="0">🌙 Délelőtt</option>
      <option value="12">☀️ Délután</option>
    </select>
  </div>

  <div id="readPeriod" class="period-indicator"></div>

  <div class="clock-layout">
    <div>
      <div class="clock" id="clock">
        <div class="hand hour-hand" id="hourHand"></div>
        <div class="hand minute-hand" id="minuteHand"></div>
        <div class="clock-center"></div>
      </div>
    </div>

    <div id="knobArea" class="knob-area">
      <div class="knob-label">Forgasd a koronát!</div>
      <div class="knob" id="knob" role="slider" tabindex="0"
           aria-label="Óra beállítása"></div>
    </div>
  </div>

  <div id="setControls" class="controls">
    <button id="checkSetButton">Ellenőrzés</button>
  </div>

  <div id="readControls">
    <div class="answer-area">
      <input id="answerHour" type="number" min="0" max="23"
             placeholder="óra" aria-label="Óra">
      <span>:</span>
      <input id="answerMinute" type="number" min="0" max="59"
             placeholder="perc" aria-label="Perc">
    </div>
    
    <div class="controls">
      <button id="checkReadButton">Ellenőrzés</button>
    </div>
  </div>

  <div id="feedback" class="feedback"></div>

  <div id="nextTaskArea" class="next-task-area">
    <button id="nextTaskButton">Következő feladat</button>
  </div>
</section>

<section id="resultScreen" class="screen">
  <h2 style="text-align:center">Ügyes voltál! 🎉</h2>
  <div class="result-score" id="resultScore">100%</div>
  <div class="result-subtitle">Eredmény</div>
  <div class="stars" id="resultStars"></div>
  <div class="result-details" id="resultDetails"></div>
  <button class="primary-button" id="restartButton">Új játék</button>
</section>

</div>

<script>
const difficultySteps = [60, 30, 15, 5, 1];
const KNOB_PIXELS_PER_STEP = 9;

let mode = "set";
let totalTasks = 10;
let currentTask = 0;
let correctAnswers = 0;
let step = 60;

let targetHour = 0;
let targetMinute = 0;
let totalMinutes = 0;

let answered = false;
let dragType = null;
let dragStartY = 0;
let knobDragRemainder = 0;
let knobRotation = 0;

const $ = id => document.getElementById(id);

function getStep() {
  return difficultySteps[Number($("difficulty").value)] || 60;
}

function normalizeTime(value) {
  return ((value % 1440) + 1440) % 1440;
}

function snapTime(value) {
  return normalizeTime(Math.round(normalizeTime(value) / step) * step);
}

function getCurrentHour24() {
  return Math.floor(totalMinutes / 60);
}

function getCurrentMinute() {
  return totalMinutes % 60;
}

function getCurrentDialMinutes() {
  return totalMinutes % 720;
}

function formatTime(hour, minute) {
  return String(hour).padStart(2, "0") + ":" +
         String(minute).padStart(2, "0");
}

function formatTargetTime() {
  return formatTime(targetHour, targetMinute);
}

function showScreen(screenId) {
  document.querySelectorAll(".screen").forEach(screen => {
    screen.classList.remove("active");
  });
  $(screenId).classList.add("active");
}

function drawNumbers() {
  const clock = $("clock");
  clock.querySelectorAll(".clock-number").forEach(el => el.remove());

  const size = clock.getBoundingClientRect().width;
  if (!size) return;

  const center = size / 2;
  const radius = size * 0.385;

  const roman = [
    "XII", "I", "II", "III", "IV", "V",
    "VI", "VII", "VIII", "IX", "X", "XI"
  ];

  for (let i = 1; i <= 12; i++) {
    const angle = (i * 30 - 90) * Math.PI / 180;
    const number = document.createElement("div");

    number.className = "clock-number";
    number.textContent = $("startNumbers").value === "roman"
      ? roman[i % 12]
      : String(i);

    number.style.left = (center + radius * Math.cos(angle)) + "px";
    number.style.top = (center + radius * Math.sin(angle)) + "px";

    clock.appendChild(number);
  }
}

function drawHands() {
  const dialMinutes = getCurrentDialMinutes();

  const minuteAngle = (dialMinutes % 60) * 6;
  const hourAngle = (dialMinutes / 60) * 30;

  $("minuteHand").style.transform = `rotate(${minuteAngle}deg)`;
  $("hourHand").style.transform = `rotate(${hourAngle}deg)`;

  updatePeriodUI();
}

function updatePeriodUI() {
  const period = getCurrentHour24() >= 12 ? "12" : "0";

  if ($("periodSelect").value !== period) {
    $("periodSelect").value = period;
  }

  $("readPeriod").textContent =
    getCurrentHour24() >= 12 ? "☀️ Délután" : "🌙 Délelőtt";
}

function setTime(hour, minute) {
  totalMinutes = normalizeTime(hour * 60 + minute);
  drawHands();
}

function updateProgress() {
  $("progressLabel").textContent =
    `${currentTask + 1}. feladat / ${totalTasks}`;

  $("scoreLabel").textContent =
    `Helyes válaszok: ${correctAnswers}`;

  $("progressFill").style.width =
    `${(currentTask / totalTasks) * 100}%`;
}

function generateTime() {
  const possibleMinutes = [];

  for (let m = 0; m < 1440; m += step) {
    possibleMinutes.push(m);
  }

  const candidate =
    possibleMinutes[Math.floor(Math.random() * possibleMinutes.length)];

  targetHour = Math.floor(candidate / 60);
  targetMinute = candidate % 60;
}

function configureMinuteInput() {
  const minuteInput = $("answerMinute");

  minuteInput.min = 0;
  minuteInput.max = 59;
  minuteInput.step = step;

}

function newTask() {
  if (currentTask >= totalTasks) {
    finishSession();
    return;
  }

  answered = false;
  $("feedback").textContent = "";
  $("feedback").className = "feedback";
  $("nextTaskArea").classList.remove("visible");

  $("checkSetButton").disabled = false;
  $("checkReadButton").disabled = false;
  $("answerHour").disabled = false;
  $("answerMinute").disabled = false;

  generateTime();

  if (mode === "set") {
    $("taskText").textContent =
      `Állítsd be az órát: ${formatTargetTime()}`;

    $("setPeriodControls").style.display = "flex";
    $("readPeriod").style.display = "none";
    $("setControls").style.display = "flex";
    $("readControls").style.display = "none";
    $("knobArea").style.display = "flex";

    // A mutatók 12:00-ról indulnak.
    // A napszak külön állítható, nem változtatja a számlap szögét.
    totalMinutes = targetHour >= 12 ? 720 : 0;
    $("periodSelect").value = targetHour >= 12 ? "12" : "0";
    drawHands();
  } else {
    $("taskText").textContent = "Mennyi az idő az órán?";

    $("setPeriodControls").style.display = "none";
    $("readPeriod").style.display = "block";
    $("setControls").style.display = "none";
    $("readControls").style.display = "block";
    $("knobArea").style.display = "none";

    setTime(targetHour, targetMinute);

    $("answerHour").value = "";
    $("answerMinute").value = "";
    configureMinuteInput();
  }

  knobRotation = 0;
  $("knob").style.transform = "rotate(0deg)";

  updateProgress();
}

function startSession() {
  step = getStep();

  totalTasks = Math.max(1, Math.min(100,
    Number($("taskCount").value) || 10));

  mode = document.querySelector('input[name="mode"]:checked').value;

  currentTask = 0;
  correctAnswers = 0;
  knobRotation = 0;

  showScreen("gameScreen");

  requestAnimationFrame(() => {
    drawNumbers();
    newTask();
  });
}

function lockAnswerControls() {
  $("checkSetButton").disabled = true;
  $("checkReadButton").disabled = true;
  $("answerHour").disabled = true;
  $("answerMinute").disabled = true;
}

function showCorrectFeedback() {
  answered = true;
  correctAnswers++;

  $("feedback").textContent = "Helyes válasz! Ügyes vagy! 🎉";
  $("feedback").className = "feedback correct";

  lockAnswerControls();
  updateProgress();

  setTimeout(() => {
    currentTask++;
    if (currentTask >= totalTasks) {
      finishSession();
    } else {
      newTask();
    }
  }, 1100);
}

function showIncorrectFeedback() {
  answered = true;

  if (mode === "read") {
    $("feedback").textContent =
      `A válasz sajnos nem helyes. A helyes válasz: ${formatTargetTime()}`;
  } else {
    // Hibás válasz esetén a számlap a helyes megoldásra áll.
    // A 24 órás napszakot is helyesen állítjuk be.
    totalMinutes = targetHour * 60 + targetMinute;
    drawHands();

    $("feedback").textContent =
      "A válasz sajnos nem helyes. Nézd meg az órán a helyes választ.";
  }

  $("feedback").className = "feedback incorrect";

  lockAnswerControls();
  $("nextTaskArea").classList.add("visible");
}

function checkSetAnswer() {
  if (answered) return;

  const correct =
    getCurrentHour24() === targetHour &&
    getCurrentMinute() === targetMinute;

  if (correct) {
    showCorrectFeedback();
  } else {
    showIncorrectFeedback();
  }
}

function checkReadAnswer() {
  if (answered) return;

  const hourValue = $("answerHour").value;
  const minuteValue = $("answerMinute").value;

  if (hourValue === "" || minuteValue === "") {
    $("feedback").textContent = "Add meg az órát és a percet is!";
    $("feedback").className = "feedback incorrect";
    return;
  }

  const hour = Number(hourValue);
  const minute = Number(minuteValue);

  const validHour =
    Number.isInteger(hour) && hour >= 0 && hour <= 23;

  const validMinute =
    Number.isInteger(minute) &&
    minute >= 0 &&
    minute <= 59 &&
    minute % step === 0;

  if (!validHour || !validMinute) {
    $("feedback").textContent =
      `A percet ${step} perces lépésekben add meg!`;
    $("feedback").className = "feedback incorrect";
    return;
  }

  if (hour === targetHour && minute === targetMinute) {
    showCorrectFeedback();
  } else {
    showIncorrectFeedback();
  }
}

function nextTaskAfterMistake() {
  if (!answered) return;

  currentTask++;

  if (currentTask >= totalTasks) {
    finishSession();
  } else {
    newTask();
  }
}

function finishSession() {
  showScreen("resultScreen");

  const percentage = Math.round(correctAnswers / totalTasks * 100);

  $("resultScore").textContent = percentage + "%";
  $("resultDetails").innerHTML =
    `Feladatok száma: ${totalTasks}<br>` +
    `Helyes válaszok: ${correctAnswers}<br>` +
    `Hibás válaszok: ${totalTasks - correctAnswers}`;

  let stars = "⭐";
  if (percentage >= 90) stars = "⭐⭐⭐";
  else if (percentage >= 70) stars = "⭐⭐";

  $("resultStars").textContent = stars;
}

function backToSetup() {
  showScreen("setupScreen");
}

/*
 * A napszakváltás csak a 12 órás ciklushoz adja hozzá
 * vagy veszi el a 12 órát. A számlapon látható mutatók
 * szögét meghatározó percérték változatlan marad.
 */
$("periodSelect").addEventListener("change", () => {
  if (answered) return;

  const dialMinutes = totalMinutes % 720;
  const periodOffset = Number($("periodSelect").value) * 60;

  totalMinutes = normalizeTime(periodOffset + dialMinutes);
  drawHands();
});

/* Korona forgatása */
function rotateKnob(steps) {
  if (answered || mode !== "set") return;

  totalMinutes = normalizeTime(totalMinutes + steps * step);
  knobRotation += steps * 36;

  $("knob").style.transform = `rotate(${knobRotation}deg)`;
  drawHands();
}

$("knob").addEventListener("pointerdown", event => {
  if (answered) return;

  dragType = "knob";
  dragStartY = event.clientY;
  knobDragRemainder = 0;

  $("knob").setPointerCapture(event.pointerId);
  event.preventDefault();
});

$("knob").addEventListener("pointermove", event => {
  if (dragType !== "knob") return;

  const delta = dragStartY - event.clientY;
  dragStartY = event.clientY;
  knobDragRemainder += delta;

  const steps = Math.trunc(knobDragRemainder / KNOB_PIXELS_PER_STEP);

  if (steps !== 0) {
    rotateKnob(steps);
    knobDragRemainder -= steps * KNOB_PIXELS_PER_STEP;
  }
});

$("knob").addEventListener("pointerup", () => {
  dragType = null;
});

$("knob").addEventListener("pointercancel", () => {
  dragType = null;
});

$("knob").addEventListener("keydown", event => {
  if (event.key === "ArrowUp") {
    event.preventDefault();
    rotateKnob(1);
  } else if (event.key === "ArrowDown") {
    event.preventDefault();
    rotateKnob(-1);
  }
});

/* Mutatók közvetlen húzása */
function getAngleFromPointer(event) {
  const rect = $("clock").getBoundingClientRect();
  const centerX = rect.left + rect.width / 2;
  const centerY = rect.top + rect.height / 2;

  const dx = event.clientX - centerX;
  const dy = event.clientY - centerY;

  let angle = Math.atan2(dy, dx) * 180 / Math.PI + 90;
  if (angle < 0) angle += 360;

  return angle;
}

function updateTimeFromPointer(event, type) {
  const angle = getAngleFromPointer(event);
  const period = getCurrentHour24() >= 12 ? 720 : 0;

  if (type === "minute") {
    const minute = Math.round(angle / 6) % 60;
    const dialHour = Math.floor(getCurrentDialMinutes() / 60);

    totalMinutes = snapTime(period + dialHour * 60 + minute);
  } else {
    const currentMinute = getCurrentMinute();
    const hourOnDial = Math.round(angle / 30) % 12;

    totalMinutes = snapTime(
      period + hourOnDial * 60 + currentMinute
    );
  }

  drawHands();
}

function startHandDrag(event, type) {
  if (answered || mode !== "set") return;

  dragType = type;
  event.currentTarget.setPointerCapture(event.pointerId);
  updateTimeFromPointer(event, type);
  event.preventDefault();
}

$("hourHand").addEventListener("pointerdown", event => {
  startHandDrag(event, "hour");
});

$("minuteHand").addEventListener("pointerdown", event => {
  startHandDrag(event, "minute");
});

$("hourHand").addEventListener("pointermove", event => {
  if (dragType === "hour") updateTimeFromPointer(event, "hour");
});

$("minuteHand").addEventListener("pointermove", event => {
  if (dragType === "minute") updateTimeFromPointer(event, "minute");
});

$("hourHand").addEventListener("pointerup", () => {
  if (dragType === "hour") dragType = null;
});

$("minuteHand").addEventListener("pointerup", () => {
  if (dragType === "minute") dragType = null;
});

$("hourHand").addEventListener("pointercancel", () => {
  if (dragType === "hour") dragType = null;
});

$("minuteHand").addEventListener("pointercancel", () => {
  if (dragType === "minute") dragType = null;
});

/* Gombok */
$("startButton").addEventListener("click", startSession);
$("checkSetButton").addEventListener("click", checkSetAnswer);
$("checkReadButton").addEventListener("click", checkReadAnswer);
$("nextTaskButton").addEventListener("click", nextTaskAfterMistake);
$("restartButton").addEventListener("click", backToSetup);

$("answerHour").addEventListener("keydown", event => {
  if (event.key === "Enter") checkReadAnswer();
});

$("answerMinute").addEventListener("keydown", event => {
  if (event.key === "Enter") checkReadAnswer();
});

window.addEventListener("resize", () => {
  if ($("gameScreen").classList.contains("active")) {
    drawNumbers();
  }
});
